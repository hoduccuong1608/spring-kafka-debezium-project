server:
  port: 8080

spring:
  data:
    redis:
      host: redis
      port: 6379
      # Optional: Add timeout and connection pool settings
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  datasource:
    url: jdbc:postgresql://postgres:5432/factory_log
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# Logging configuration
logging:
  level:
    org.springframework: INFO
    com.example: DEBUG
    org.apache.kafka: WARN
