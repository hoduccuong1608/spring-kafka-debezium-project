server:
  port: 8080

spring:
  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      group-id: product_log_group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*" # Allow deserialization of JSON objects
        spring.json.value.default.type: com.fasterxml.jackson.databind.JsonNode
    listener:
      missing-topics-fatal: false # Prevent app crash if topic doesn't exist

  data:
    redis:
      host: redis
      port: 6379
      # Optional: Add timeout and connection pool settings
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  datasource:
    url: jdbc:postgresql://postgres:5432/factory_log
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# Logging configuration
logging:
  level:
    org.springframework: INFO
    com.example: DEBUG
    org.apache.kafka: WARN