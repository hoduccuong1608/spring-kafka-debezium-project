<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Production Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/babel-standalone@7.22.9/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      function Dashboard() {
        const [metrics, setMetrics] = React.useState({
          completed_quantity: 0,
          error_count: 0,
          workorder_progress: {},
        });

        React.useEffect(() => {
          const ws = new WebSocket("ws://localhost:8080/ws");
          ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            setMetrics(data);
          };
          ws.onclose = () => console.log("WebSocket closed");
          return () => ws.close();
        }, []);

        return (
          <div className="container mx-auto p-4">
            <h1 className="text-2xl font-bold mb-4">Production Dashboard</h1>
            <div className="grid grid-cols-2 gap-4">
              <div className="bg-blue-100 p-4 rounded">
                <h2 className="text-lg font-semibold">Completed Quantity</h2>
                <p className="text-2xl">{metrics.completed_quantity}</p>
              </div>
              <div className="bg-red-100 p-4 rounded">
                <h2 className="text-lg font-semibold">Error Count</h2>
                <p className="text-2xl">{metrics.error_count}</p>
              </div>
            </div>
            <h2 className="text-xl font-semibold mt-6">Work Order Progress</h2>
            <div className="mt-2">
              {Object.entries(metrics.workorder_progress).map(([wo, qty]) => (
                <div key={wo} className="bg-gray-100 p-2 rounded mb-2">
                  <span className="font-medium">{wo}</span>: {qty} units
                </div>
              ))}
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<Dashboard />);
    </script>
  </body>
</html>
